# Uploads the careers site to the cPanel hosting on every push to the site's branch
# (claude/tender-ptolemy-gt93ih, the repo's only branch). It can also be run by hand
# from the Actions tab.
#
# One-time setup:
#  1. cPanel > FTP Accounts: create an account whose Directory is the subdomain's
#     folder (for example public_html/recruitment.jkuates.co.ke).
#  2. GitHub > this repo > Settings > Secrets and variables > Actions > New repository secret:
#       FTP_SERVER    the FTP host, for example ftp.jkuates.co.ke
#       FTP_USERNAME  the full FTP username, for example deploy@recruitment.jkuates.co.ke
#       FTP_PASSWORD  that account's password
#
# Only changed files are uploaded. README.md, the zoho/ notes and the git files stay out.

name: Deploy to cPanel

on:
  push:
    branches: [claude/tender-ptolemy-gt93ih]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            zoho/**
